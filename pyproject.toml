[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blackjack-practice-trainer"
version = "0.1.0"
description = "Blackjack basic strategy and Hi-Lo counting practice tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
blackjack-trainer = "blackjack_trainer.__main__:main"

[tool.setuptools.packages.find]
include = ["blackjack_trainer*"]
